<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChattyCHOP Inbox</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0f0f0f;
  --sidebar:#161616;
  --surface:#1e1e1e;
  --surface2:#252525;
  --border:#2a2a2a;
  --text:#e8e8e8;
  --text2:#999;
  --text3:#666;
  --accent:#ff6b2b;
  --accent2:#ff8c42;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;
  --blue:#3b82f6;
  --purple:#8b5cf6;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
.app{display:flex;height:100vh;}

/* SIGN IN */
.signin-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;}
.signin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:44px 40px;width:100%;max-width:400px;text-align:center;}
.signin-logo{width:60px;height:60px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;}
.signin-title{font-size:24px;font-weight:700;margin-bottom:8px;}
.signin-sub{font-size:14px;color:var(--text2);margin-bottom:32px;line-height:1.6;}
.google-signin-btn{width:100%;padding:13px;background:#fff;color:#333;border:none;border-radius:9px;cursor:pointer;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity 0.2s;}
.google-signin-btn:hover{opacity:0.92;}
.signin-note{font-size:12px;color:var(--text3);margin-top:16px;line-height:1.6;}

/* SIDEBAR */
.sidebar{width:260px;min-width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden;}
.sidebar-top{padding:12px;border-bottom:1px solid var(--border);}
.new-chat-btn{width:100%;padding:10px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;transition:background 0.2s;}
.new-chat-btn:hover{background:var(--accent2);}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:8px;}
.nav-item{padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:10px;transition:all 0.15s;position:relative;}
.nav-item:hover{background:var(--surface);color:var(--text);}
.nav-item.active{background:var(--surface);color:var(--text);border-left:2px solid var(--accent);}
.nav-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;margin-left:auto;}
.sidebar-section{padding:0 8px;margin-top:4px;}
.sidebar-section-label{font-size:11px;color:var(--text3);padding:6px 8px;text-transform:uppercase;letter-spacing:0.5px;}
.chat-item{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px;transition:all 0.15s;}
.chat-item:hover{background:var(--surface);color:var(--text);}
.chat-item.active{background:var(--surface2);color:var(--text);}
.chat-item-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
.chat-item-actions{display:none;gap:2px;}
.chat-item:hover .chat-item-actions{display:flex;}
.chat-action-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:3px;border-radius:4px;font-size:13px;}
.chat-action-btn:hover{color:var(--text);background:var(--border);}
.sidebar-chats{flex:1;overflow-y:auto;padding-bottom:8px;}
.sidebar-chats::-webkit-scrollbar{width:4px;}
.sidebar-chats::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.sidebar-bottom{padding:8px;border-top:1px solid var(--border);}
.settings-btn{width:100%;padding:9px 12px;background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px;border-radius:7px;transition:all 0.15s;}
.settings-btn:hover{background:var(--surface);color:var(--text);}

/* USER CHIP */
.user-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:4px;}
.user-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-email{font-size:11px;color:var(--text3);}
.signout-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:5px;}
.signout-btn:hover{color:var(--red);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* TOPBAR */
.topbar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;}
.topbar-toggle{background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px;padding:6px;border-radius:6px;}
.topbar-toggle:hover{background:var(--surface);color:var(--text);}
.topbar-title{font-size:15px;font-weight:600;color:var(--text);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.topbar-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:7px;border-radius:7px;font-size:16px;position:relative;transition:all 0.15s;}
.topbar-btn:hover{background:var(--surface);color:var(--text);}
.notif-badge{position:absolute;top:4px;right:4px;background:var(--red);width:8px;height:8px;border-radius:50%;}
.provider-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;}
.provider-badge:hover{color:var(--text);}

/* CHAT VIEW */
.chat-view{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.messages{flex:1;overflow-y:auto;padding:24px 0;}
.messages::-webkit-scrollbar{width:6px;}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.message-row{display:flex;gap:12px;padding:6px 24px;max-width:860px;margin:0 auto;width:100%;}
.message-row.user{flex-direction:row-reverse;}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;overflow:hidden;}
.avatar.ai{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.avatar.user{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.bubble{max-width:75%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;}
.bubble.ai{background:var(--surface);color:var(--text);}
.bubble.user{background:var(--accent);color:#fff;}
.bubble p{margin-bottom:8px;}
.bubble p:last-child{margin-bottom:0;}
.bubble code{background:var(--surface2);padding:2px 6px;border-radius:4px;font-size:13px;}
.bubble pre{background:var(--surface2);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0;}
.typing-dots{display:flex;gap:4px;padding:8px 0;}
.typing-dots span{width:7px;height:7px;background:var(--text3);border-radius:50%;animation:bounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);}}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px;}
.welcome-logo{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.welcome-title{font-size:26px;font-weight:700;color:var(--text);}
.welcome-sub{font-size:15px;color:var(--text2);text-align:center;max-width:420px;line-height:1.6;}
.starters{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px;}
.starter{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;font-size:13px;color:var(--text2);transition:all 0.15s;text-align:left;}
.starter:hover{border-color:var(--accent);color:var(--text);}

/* INPUT */
.input-area{padding:16px 24px;border-top:1px solid var(--border);}
.input-wrap{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:flex-end;gap:10px;padding:10px 14px;transition:border-color 0.2s;}
.input-wrap:focus-within{border-color:var(--accent);}
.input-wrap textarea{flex:1;background:none;border:none;color:var(--text);font-size:14px;resize:none;outline:none;max-height:200px;min-height:24px;line-height:1.5;font-family:inherit;}
.input-wrap textarea::placeholder{color:var(--text3);}
.send-btn{background:var(--accent);border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:background 0.2s;}
.send-btn:hover{background:var(--accent2);}
.send-btn:disabled{background:var(--surface2);color:var(--text3);cursor:not-allowed;}
.stop-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.input-hint{text-align:center;font-size:11px;color:var(--text3);margin-top:8px;max-width:860px;margin-left:auto;margin-right:auto;}

/* DRAFT BANNER */
.draft-banner{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;margin:0 24px 12px;max-width:860px;margin-left:auto;margin-right:auto;}
.draft-banner-label{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
.draft-to{font-size:13px;color:var(--text2);margin-bottom:4px;}
.draft-subject{font-size:13px;color:var(--text2);margin-bottom:10px;}
.draft-body{font-size:14px;color:var(--text);background:var(--surface2);border-radius:8px;padding:10px;margin-bottom:10px;white-space:pre-wrap;border:none;outline:none;width:100%;resize:none;min-height:60px;font-family:inherit;}
.draft-actions{display:flex;gap:8px;}
.draft-send{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;}
.draft-send:hover{opacity:0.9;}
.draft-cancel{background:none;color:var(--text3);border:1px solid var(--border);padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;}

/* INBOX VIEW */
.panel{flex:1;overflow-y:auto;padding:24px;}
.panel::-webkit-scrollbar{width:6px;}
.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.panel-title{font-size:20px;font-weight:700;}
.search-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-size:13px;width:100%;outline:none;margin-bottom:16px;transition:border-color 0.2s;}
.search-bar:focus{border-color:var(--accent);}
.email-list{display:flex;flex-direction:column;gap:2px;}
.email-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all 0.15s;display:flex;gap:12px;align-items:flex-start;}
.email-item:hover{border-color:var(--accent);background:var(--surface2);}
.email-item.unread{border-left:3px solid var(--accent);}
.email-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.email-info{flex:1;min-width:0;}
.email-from{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.email-subject{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.email-preview{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;}
.email-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.email-time{font-size:11px;color:var(--text3);}
.email-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;}
.badge.urgent{background:#7f1d1d;color:#fca5a5;}
.badge.critical{background:#7f1d1d;color:#fca5a5;}
.badge.high{background:#78350f;color:#fcd34d;}
.badge.medium{background:#1a2e1a;color:#86efac;}
.badge.spam{background:var(--surface2);color:var(--text3);}
.badge.label-work{background:#1e3a5f;color:#93c5fd;}
.badge.label-personal{background:#2d1a4a;color:#c4b5fd;}
.badge.label-finance{background:#1a2e1a;color:#86efac;}
.badge.label-alert{background:#7f1d1d;color:#fca5a5;}
.email-delete{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:4px;font-size:14px;opacity:0;}
.email-item:hover .email-delete{opacity:1;}
.email-delete:hover{color:var(--red);}

/* FOLLOW UP BANNER */
.followup-banner{background:var(--surface);border:1px solid var(--yellow);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.followup-banner-title{font-size:13px;font-weight:600;color:var(--yellow);margin-bottom:10px;}
.followup-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);}
.followup-item:last-child{border-bottom:none;}
.followup-text{flex:1;font-size:13px;color:var(--text2);}
.followup-action{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:11px;}
.followup-action:hover{color:var(--text);border-color:var(--text2);}

/* EMAIL DETAIL */
.email-detail{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.email-detail-header{padding:20px 24px;border-bottom:1px solid var(--border);}
.email-detail-subject{font-size:20px;font-weight:700;margin-bottom:10px;}
.email-detail-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.email-detail-from{font-size:14px;color:var(--text2);}
.email-detail-time{font-size:13px;color:var(--text3);}
.email-detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.action-btn{padding:8px 16px;border-radius:7px;font-size:13px;cursor:pointer;font-weight:500;border:none;transition:all 0.15s;}
.action-btn.primary{background:var(--accent);color:#fff;}
.action-btn.primary:hover{background:var(--accent2);}
.action-btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.action-btn.secondary:hover{border-color:var(--text2);}
.action-btn.danger{background:#7f1d1d;color:#fca5a5;}
.email-detail-body{flex:1;overflow-y:auto;padding:24px;font-size:14px;line-height:1.7;color:var(--text);}
.show-more{color:var(--accent);background:none;border:none;cursor:pointer;font-size:13px;margin-top:8px;padding:0;}

/* COMPOSE */
.compose-view{flex:1;overflow-y:auto;padding:24px;}
.compose-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;max-width:700px;}
.compose-ai-bar{background:var(--surface2);padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;}
.compose-ai-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;}
.compose-ai-input:focus{border-color:var(--accent);}
.compose-ai-btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;}
.compose-field{display:flex;align-items:center;border-bottom:1px solid var(--border);}
.compose-label{padding:12px 16px;font-size:13px;color:var(--text3);width:80px;flex-shrink:0;}
.compose-input{flex:1;background:none;border:none;padding:12px 0;color:var(--text);font-size:14px;outline:none;}
.compose-body{width:100%;background:none;border:none;padding:16px;color:var(--text);font-size:14px;resize:none;min-height:220px;outline:none;font-family:inherit;line-height:1.6;}
.compose-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;}

/* TODO */
.todo-view{flex:1;overflow-y:auto;padding:24px;}
.todo-input-row{display:flex;gap:10px;margin-bottom:20px;}
.todo-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;}
.todo-input:focus{border-color:var(--accent);}
.todo-add-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;}
.todo-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;transition:all 0.15s;}
.todo-item.done{opacity:0.5;}
.todo-check{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all 0.15s;}
.todo-check.checked{background:var(--green);border-color:var(--green);}
.todo-text{flex:1;font-size:14px;line-height:1.5;}
.todo-text.done{text-decoration:line-through;color:var(--text3);}
.todo-source{font-size:11px;color:var(--accent);margin-top:4px;}
.todo-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px;}
.todo-del:hover{color:var(--red);}
.todo-due{font-size:11px;color:var(--yellow);margin-top:3px;}

/* NOTES */
.notes-view{flex:1;overflow-y:auto;padding:24px;}
.note-new{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px;}
.note-textarea{width:100%;background:none;border:none;color:var(--text);font-size:14px;resize:none;outline:none;min-height:80px;font-family:inherit;line-height:1.6;}
.note-textarea::placeholder{color:var(--text3);}
.note-save{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;}
.note-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px;}
.note-content{font-size:14px;color:var(--text);line-height:1.6;white-space:pre-wrap;}
.note-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.note-date{font-size:11px;color:var(--text3);}
.note-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;}
.note-del:hover{color:var(--red);}

/* ANALYTICS */
.analytics-view{flex:1;overflow-y:auto;padding:24px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
.stat-num{font-size:28px;font-weight:700;color:var(--accent);}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px;}
.analytics-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
.analytics-section h3{font-size:15px;font-weight:600;margin-bottom:14px;}
.sender-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);}
.sender-row:last-child{border-bottom:none;}
.sender-bar-wrap{flex:1;background:var(--surface2);border-radius:4px;height:6px;overflow:hidden;}
.sender-bar{height:100%;background:var(--accent);border-radius:4px;}
.sender-count{font-size:12px;color:var(--text3);width:30px;text-align:right;}
.hour-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:10px;}
.hour-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.hour-bar{width:100%;background:var(--accent);border-radius:2px;min-height:2px;transition:height 0.3s;}
.hour-label{font-size:9px;color:var(--text3);}
.label-chart{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.label-chip{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}

/* CALENDAR */
.calendar-view{flex:1;overflow-y:auto;padding:24px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.cal-nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:hover{color:var(--text);}
.cal-month-title{font-size:16px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px;}
.cal-day-header{text-align:center;font-size:11px;color:var(--text3);padding:6px 0;text-transform:uppercase;}
.cal-day{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px;min-height:64px;cursor:pointer;transition:all 0.15s;}
.cal-day:hover{border-color:var(--accent);}
.cal-day.today{border-color:var(--accent);background:rgba(255,107,43,0.08);}
.cal-day.other-month{opacity:0.35;}
.cal-day-num{font-size:13px;font-weight:600;margin-bottom:4px;}
.cal-event-dot{font-size:10px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.cal-events-list{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;}
.cal-events-list h3{font-size:15px;font-weight:600;margin-bottom:12px;}
.cal-event-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.cal-event-item:last-child{border-bottom:none;}
.cal-event-time{font-size:12px;color:var(--accent);width:70px;flex-shrink:0;font-weight:600;}
.cal-event-title{font-size:13px;color:var(--text);flex:1;}
.cal-event-loc{font-size:11px;color:var(--text3);margin-top:2px;}
.cal-loading{text-align:center;padding:40px;color:var(--text3);}

/* SMART CLEAN */
.clean-banner{background:var(--surface);border:1px solid var(--yellow);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.clean-btn{background:var(--yellow);color:#000;border:none;padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;}

/* SETTINGS MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--sidebar);border:1px solid var(--border);border-radius:14px;width:500px;max-height:82vh;overflow-y:auto;padding:24px;}
.modal h2{font-size:18px;font-weight:700;margin-bottom:20px;}
.modal-section{margin-bottom:20px;}
.modal-section label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
.modal-select,.modal-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;}
.modal-select:focus,.modal-input:focus{border-color:var(--accent);}
.modal-input{font-family:monospace;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}
.modal-save{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;}
.modal-cancel{background:none;border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;}
.modal-test{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:13px;}
.test-result{font-size:13px;margin-top:8px;padding:8px 12px;border-radius:6px;}
.test-result.ok{background:#1a2e1a;color:var(--green);}
.test-result.err{background:#2e1a1a;color:var(--red);}

/* MEMORY MODAL */
.memory-item{background:var(--surface2);border-radius:7px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px;}
.memory-text{flex:1;font-size:13px;color:var(--text);}
.memory-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;}
.memory-del:hover{color:var(--red);}

/* NOTIF DROPDOWN */
.notif-dropdown{position:absolute;top:48px;right:8px;width:340px;background:var(--sidebar);border:1px solid var(--border);border-radius:12px;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,0.5);overflow:hidden;}
.notif-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;}
.notif-item:hover{background:var(--surface);}
.notif-item:last-child{border-bottom:none;}
.notif-from{font-size:13px;font-weight:600;}
.notif-subject{font-size:12px;color:var(--text2);margin-top:2px;}
.notif-time{font-size:11px;color:var(--text3);margin-top:2px;}

/* CLEAN MODAL */
.clean-email-item{background:var(--surface2);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.clean-email-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
.clean-email-info{flex:1;}
.clean-email-from{font-size:13px;font-weight:600;}
.clean-email-subject{font-size:12px;color:var(--text2);}
.clean-email-reason{font-size:11px;color:var(--yellow);margin-top:2px;}

/* MISC */
.divider{border:none;border-top:1px solid var(--border);margin:8px 0;}
.empty{text-align:center;padding:40px;color:var(--text3);font-size:14px;}
.pulse{animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.green{background:var(--green);}
.dot.red{background:var(--red);}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;

const GOOGLE_CLIENT_ID = "132079774560-dfcjn2cke9jactgltr4v1g1c5nhvc5pe.apps.googleusercontent.com";
const GMAIL_SCOPE = "https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email";

const GAS_URL = "https://script.google.com/macros/s/AKfycbxLIOk0nlj6nzeIMpV_K_Nkk3uN7dIxUzUhdmBFKC8GmKM2M1Opb2gUadoSqmtQxQQ4iA/exec";

// Wireless config from GAS
let APP_CONFIG = {
  groqKey:"",freeLimit:15,proLimit:999,premiumLimit:999,
  freeModel:"llama-3.3-70b-versatile",proModel:"llama-3.3-70b-versatile",premiumModel:"gpt-4o",
  proCodes:[],announcement:{text:"",type:"info"},
};
async function fetchAppConfig(){
  try{
    const r=await fetch(GAS_URL+"?action=getAll&t="+Date.now());
    const d=await r.json();
    if(d&&d.config)APP_CONFIG={...APP_CONFIG,...d.config,proCodes:d.proCodes||[],announcement:d.announcement||{text:"",type:"info"}};
  }catch(e){
    try{
      await new Promise(function(res){
        var cb="gcc"+Date.now();
        var s=document.createElement("script");
        window[cb]=function(d){if(d&&d.config)APP_CONFIG={...APP_CONFIG,...d.config,proCodes:d.proCodes||[],announcement:d.announcement||{text:"",type:"info"}};delete window[cb];document.head.removeChild(s);res();};
        s.onerror=function(){res();};
        s.src=GAS_URL+"?action=getAll&callback="+cb+"&t="+Date.now();
        document.head.appendChild(s);
        setTimeout(res,4000);
      });
    }catch(e2){}
  }
}

// Per-account localStorage
let _ak="anon";
function setAK(email){_ak=(email||"anon").replace(/[^a-z0-9]/gi,"_");}
const save=(k,v)=>{try{localStorage.setItem(_ak+"_"+k,JSON.stringify(v));}catch(e){}};
const load=(k,d)=>{try{const v=localStorage.getItem(_ak+"_"+k);return v?JSON.parse(v):d;}catch(e){return d;}};

// Tier system
function getUserTier(email){
  if(!email)return"free";
  var e=email.toLowerCase().trim(),now=Date.now();
  var codes=APP_CONFIG.proCodes||[];
  for(var i=0;i<codes.length;i++){
    if(codes[i].gmail===e&&codes[i].expiry>now){
      var t=codes[i].tier.toLowerCase();return t==="friend"?"pro":t;
    }
  }
  try{var s=JSON.parse(localStorage.getItem("ci_pro_"+e)||"null");if(s&&s.expiry>now)return s.tier.toLowerCase()==="friend"?"pro":s.tier.toLowerCase();}catch(e){}
  return"free";
}
function activateCode(code,email){
  if(!code||!email)return{ok:false,msg:"Enter a code"};
  var e=email.toLowerCase().trim(),now=Date.now();
  var codes=APP_CONFIG.proCodes||[];
  var match=null;
  for(var i=0;i<codes.length;i++){if(codes[i].code===code.toUpperCase()&&codes[i].gmail===e&&codes[i].expiry>now){match=codes[i];break;}}
  if(!match)return{ok:false,msg:"Invalid code or not for your account"};
  try{localStorage.setItem("ci_pro_"+e,JSON.stringify({tier:match.tier.toLowerCase(),expiry:match.expiry}));}catch(ex){}
  return{ok:true,tier:match.tier.toLowerCase(),msg:"Activated! Enjoy your "+match.tier+" plan!"};
}
function getTierConfig(tier){
  if(tier==="premium")return{limit:APP_CONFIG.premiumLimit||999,model:APP_CONFIG.premiumModel||APP_CONFIG.freeModel,key:APP_CONFIG.groqKey,provider:"groq",label:"Premium"};
  if(tier==="pro")return{limit:APP_CONFIG.proLimit||999,model:APP_CONFIG.proModel||APP_CONFIG.freeModel,key:APP_CONFIG.groqKey,provider:"groq",label:"Pro"};
  return{limit:APP_CONFIG.freeLimit||15,model:APP_CONFIG.freeModel||"llama-3.3-70b-versatile",key:APP_CONFIG.groqKey,provider:"groq",label:"Free"};
}
function getTodayCount(email){return parseInt(localStorage.getItem("ci_m_"+(email||"x")+"_"+new Date().toDateString())||"0");}
function incTodayCount(email){var k="ci_m_"+(email||"x")+"_"+new Date().toDateString();localStorage.setItem(k,(getTodayCount(email)+1).toString());}

const playSound = (type) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if(type==='urgent'){
      [0,0.15,0.3].forEach(t=>{
        const o2=ctx.createOscillator(),g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);
        o2.frequency.value=880;g2.gain.setValueAtTime(0.3,ctx.currentTime+t);
        g2.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+t+0.1);
        o2.start(ctx.currentTime+t);o2.stop(ctx.currentTime+t+0.1);
      });
    } else {
      osc.frequency.value=523;gain.gain.setValueAtTime(0.2,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3);
      osc.start();osc.stop(ctx.currentTime+0.3);
    }
  } catch(e){}
};

const PROVIDERS = {
  groq:{ name:'Groq', models:['llama-3.3-70b-versatile','llama-3.1-8b-instant','mixtral-8x7b-32768'], url:'https://api.groq.com/openai/v1/chat/completions' },
  openai:{ name:'OpenAI', models:['gpt-4o','gpt-4o-mini','gpt-4-turbo'], url:'https://api.openai.com/v1/chat/completions' },
  gemini:{ name:'Gemini', models:['gemini-2.0-flash','gemini-1.5-pro','gemini-1.5-flash'], url:'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions' },
  cohere:{ name:'Cohere', models:['command-r7b-12-2024','command-r-08-2024','command-light'], url:'https://api.cohere.com/compatibility/v1/chat/completions' },
  mistral:{ name:'Mistral', models:['mistral-large-latest','mistral-medium-latest','mistral-small-latest'], url:'https://api.mistral.ai/v1/chat/completions' },
  anthropic:{ name:'Claude', models:['claude-sonnet-4-6','claude-haiku-4-5-20251001'], url:null },
  openrouter:{ name:'OpenRouter', models:['meta-llama/llama-3.3-70b-instruct:free','google/gemma-3-27b-it:free','qwen/qwen3-8b:free'], url:'https://openrouter.ai/api/v1/chat/completions' },
};

async function callAI(messages, settings, signal) {
  const {provider='groq', apiKey='', model} = settings;
  if(!apiKey) throw new Error('No API key set. Go to Settings → AI Provider.');
  if(provider==='anthropic') {
    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', signal,
      headers:{'x-api-key':apiKey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:model||'claude-sonnet-4-6', max_tokens:1024, messages})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error?.message||'API error');
    return d.content[0].text;
  }
  const p = PROVIDERS[provider];
  const url = provider==='gemini'?`${p.url}?key=${apiKey}`:p.url;
  const r = await fetch(url,{
    method:'POST', signal,
    headers:{'Authorization':`Bearer ${apiKey}`,'Content-Type':'application/json'},
    body: JSON.stringify({model:model||p.models[0], messages, stream:false})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message||'API error');
  return d.choices[0].message.content;
}

async function gmailFetch(path, token, opts={}) {
  const r = await fetch(`https://gmail.googleapis.com/gmail/v1${path}`,{
    ...opts,
    headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json',...(opts.headers||{})}
  });
  if(r.status===401) { save('gmail_token',''); throw new Error('Token expired'); }
  return r.json();
}

async function calendarFetch(path, token) {
  const r = await fetch(`https://www.googleapis.com/calendar/v3${path}`,{
    headers:{'Authorization':`Bearer ${token}`}
  });
  return r.json();
}

async function getUserInfo(token) {
  const r = await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{
    headers:{'Authorization':`Bearer ${token}`}
  });
  return r.json();
}

function getInitials(name){ return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
const COLORS=['#ef4444','#3b82f6','#8b5cf6','#22c55e','#f59e0b','#ec4899','#06b6d4','#f97316'];
function hashColor(str){ let h=0; for(let c of str) h=c.charCodeAt(0)+((h<<5)-h); return COLORS[Math.abs(h)%COLORS.length]; }

function formatTime(dateStr){
  if(!dateStr) return '';
  const d=new Date(dateStr), now=new Date(), diff=now-d;
  if(diff<86400000) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if(diff<172800000) return 'Yesterday';
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}

function smartLabel(subject='', from='') {
  const s=subject.toLowerCase(), f=from.toLowerCase();
  if(s.includes('invoice')||s.includes('payment')||s.includes('bill')||s.includes('receipt')||f.includes('finance')||f.includes('billing')) return 'finance';
  if(s.includes('alert')||s.includes('urgent')||s.includes('action required')||s.includes('warning')) return 'alert';
  if(f.includes('slack')||f.includes('jira')||f.includes('github')||f.includes('confluence')||s.includes('meeting')||s.includes('project')) return 'work';
  if(f.includes('gmail')||f.includes('google')||f.includes('apple')||f.includes('amazon')||f.includes('facebook')||f.includes('twitter')) return 'personal';
  return null;
}

function needsFollowUp(email) {
  const s=(email.subject||'').toLowerCase(), b=(email.body||'').toLowerCase();
  const signals=['please reply','let me know','awaiting your response','your thoughts','could you','can you','please confirm','respond by','get back to me','follow up'];
  return signals.some(sig=>s.includes(sig)||b.includes(sig));
}

// ── MAIN APP ─────────────────────────────────────────────────
function App() {
  const [view, setView] = useState('chat');
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [showSettings, setShowSettings] = useState(false);
  const [showMemory, setShowMemory] = useState(false);
  const [showClean, setShowClean] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [showProModal, setShowProModal] = useState(false);
  const [donors, setDonors] = useState(function(){try{return JSON.parse(localStorage.getItem('ci_donors')||'[]');}catch(e){return [];}});
  const [showNotif, setShowNotif] = useState(false);
  const [settings, setSettings] = useState(() => load('ai_settings',{provider:'groq',apiKey:'',model:''}));
  const [chats, setChats] = useState(() => load('chats',[]));
  const [activeChatId, setActiveChatId] = useState(null);
  const [memory, setMemory] = useState(() => load('memory',{name:'',role:'',company:'',people:[],facts:[],instructions:[]}));
  const [emails, setEmails] = useState([]);
  const [selectedEmail, setSelectedEmail] = useState(null);
  const [newEmails, setNewEmails] = useState([]);
  const [todos, setTodos] = useState(() => load('todos',[]));
  const [notes, setNotes] = useState(() => load('notes',[]));
  const [gmailToken, setGmailToken] = useState(function(){try{return localStorage.getItem('gmail_token')||'';}catch(e){return '';}});
  const [userInfo, setUserInfo] = useState(function(){try{var u=JSON.parse(localStorage.getItem('user_info')||'null');if(u&&u.email)setAK(u.email);return u;}catch(e){return null;}});
  const emailIdsRef = useRef(new Set());
  const abortRef = useRef(null);

  useEffect(() => { save('chats',chats); },[chats]);
  useEffect(() => { save('todos',todos); },[todos]);
  useEffect(() => { save('notes',notes); },[notes]);
  useEffect(() => { save('ai_settings',settings); },[settings]);
  useEffect(() => { save('memory',memory); },[memory]);
  useEffect(function(){ try{localStorage.setItem('gmail_token',gmailToken||'');}catch(e){} },[gmailToken]);
  useEffect(function(){try{localStorage.setItem('ci_donors',JSON.stringify(donors));}catch(e){}},[donors]);

  const signInGoogle = () => {
    const params = new URLSearchParams({
      client_id: GOOGLE_CLIENT_ID,
      redirect_uri: window.location.origin + window.location.pathname,
      response_type: 'token',
      scope: GMAIL_SCOPE,
      prompt: 'consent'
    });
    window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
  };

  const signOut = () => {
    setGmailToken('');setUserInfo(null);setEmails([]);
    try{localStorage.removeItem('gmail_token');localStorage.removeItem('user_info');}catch(e){}
  };

  // Handle OAuth redirect
  useEffect(() => {
    const hash = window.location.hash;
    if(hash.includes('access_token')) {
      const p = new URLSearchParams(hash.slice(1));
      const token = p.get('access_token');
      if(token) {
        setGmailToken(token);
        try{localStorage.setItem('gmail_token',token);}catch(e){}
        window.history.replaceState({},'',window.location.pathname);
        getUserInfo(token).then(info => { if(info.name) { setUserInfo(info); save('user_info',info); } }).catch(()=>{});
      }
    }
  },[]);

  // Fetch user info if we have token but no userInfo
  useEffect(() => {
    if(gmailToken && !userInfo) {
      getUserInfo(gmailToken).then(info => { if(info.name) { setUserInfo(info); save('user_info',info); } }).catch(()=>{});
    }
  },[gmailToken]);

  const fetchEmails = useCallback(async () => {
    if(!gmailToken) return;
    try {
      const list = await gmailFetch('/users/me/messages?maxResults=50&q=in:inbox', gmailToken);
      if(!list.messages) return;
      const newOnes = [];
      const fetched = await Promise.all(list.messages.slice(0,50).map(async m => {
        const msg = await gmailFetch(`/users/me/messages/${m.id}?format=full`, gmailToken);
        const hdrs = msg.payload?.headers||[];
        const get = n => hdrs.find(h=>h.name===n)?.value||'';
        const fromRaw = get('From');
        const nameMatch = fromRaw.match(/^([^<]+)</);
        const emailMatch = fromRaw.match(/<([^>]+)>/);
        const fromName = nameMatch?nameMatch[1].trim():fromRaw;
        const fromEmail = emailMatch?emailMatch[1]:fromRaw;
        const extractBody = (p) => {
          if(p?.body?.data) return atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/'));
          if(p?.parts) { for(const pt of p.parts){const b=extractBody(pt);if(b)return b;} }
          return '';
        };
        const body = extractBody(msg.payload)||'';
        const subject = get('Subject');
        const label = smartLabel(subject, fromEmail);
        const email = {
          id:m.id, from:fromName, email:fromEmail,
          initials:getInitials(fromName), color:hashColor(fromEmail),
          subject, body, time:get('Date'),
          read:!msg.labelIds?.includes('UNREAD'),
          urgent:(subject||'').toLowerCase().includes('urgent')||(subject||'').toLowerCase().includes('asap'),
          label, needsReply: needsFollowUp({subject,body}),
          importance:null
        };
        if(!emailIdsRef.current.has(m.id)){emailIdsRef.current.add(m.id);newOnes.push(email);}
        return email;
      }));
      setEmails(fetched.filter(Boolean));
      if(newOnes.length>0){
        setNewEmails(prev=>[...newOnes,...prev].slice(0,20));
        newOnes.forEach(e=>{try{playSound(e.urgent?'urgent':'normal');}catch(e){}});
        if(Notification.permission==='granted'){
          newOnes.slice(0,3).forEach(e=>new Notification(`📧 ${e.from}`,{body:e.subject}));
        }
      }
    } catch(err){ if(err.message.includes('expired')) setGmailToken(''); }
  },[gmailToken]);

  useEffect(()=>{
    if(gmailToken){
      if(Notification.permission==='default') Notification.requestPermission();
      fetchEmails();
      const t = setInterval(fetchEmails,30000);
      return ()=>clearInterval(t);
    }
  },[gmailToken,fetchEmails]);

  const activeChat = chats.find(c=>c.id===activeChatId);

  const newChat = () => {
    const id = Date.now().toString();
    setChats(prev=>[{id,title:'New Chat',messages:[],createdAt:Date.now()},...prev]);
    setActiveChatId(id); setView('chat');
  };

  const deleteChat = (id,e) => {
    e.stopPropagation();
    setChats(prev=>prev.filter(c=>c.id!==id));
    if(activeChatId===id) setActiveChatId(null);
  };

  const updateMemoryFromMessage = (text) => {
    const lower = text.toLowerCase();
    const nameMatch = text.match(/call me (\w+)/i)||text.match(/my name is (\w+)/i);
    if(nameMatch) setMemory(m=>({...m,name:nameMatch[1]}));
    const compMatch = text.match(/i work (?:at|for) ([^,.]+)/i);
    if(compMatch) setMemory(m=>({...m,company:compMatch[1].trim()}));
    const personMatch = text.match(/(\w+(?:\s+\w+)?) is (?:my )?([\w\s]+)/i);
    if(personMatch&&!lower.includes('this')&&!lower.includes('that')){
      const pName=personMatch[1],pRole=personMatch[2];
      setMemory(m=>({...m,people:[...m.people.filter(p=>p.name!==pName),{name:pName,role:pRole.trim()}]}));
    }
    if(lower.includes('remember that')||lower.includes('always')||lower.includes('never')||lower.includes('please remember')){
      setMemory(m=>({...m,instructions:[...m.instructions,{text,time:Date.now()}].slice(-20)}));
    }
    if(lower.includes('i prefer')||lower.includes('i like')||lower.includes('i hate')||lower.includes('i love')||lower.includes('i usually')){
      setMemory(m=>({...m,facts:[...m.facts,{text,time:Date.now()}].slice(-30)}));
    }
  };

  const buildSystemPrompt = () => {
    const m = memory;
    let sys = `You are a personal AI assistant${m.name?` for ${m.name}`:''}. You are helpful, professional, and concise. Never use **bold** or bullet points with asterisks in normal replies — write naturally.`;
    if(m.name) sys+=`\n\nUser's name: ${m.name}.`;
    if(m.role) sys+=` Role: ${m.role}.`;
    if(m.company) sys+=` Company: ${m.company}.`;
    if(m.people?.length) sys+=`\n\nPeople they know:\n${m.people.map(p=>`- ${p.name}: ${p.role}`).join('\n')}`;
    if(m.facts?.length) sys+=`\n\nPreferences:\n${m.facts.slice(-10).map(f=>f.text).join('\n')}`;
    if(m.instructions?.length) sys+=`\n\nInstructions (always follow):\n${m.instructions.slice(-10).map(i=>i.text).join('\n')}`;
    if(emails.length){ const recent=emails.slice(0,20).map(e=>`- From: ${e.from} | Subject: ${e.subject} | ${e.read?'Read':'Unread'}${e.needsReply?' | Needs reply':''}`).join('\n'); sys+=`\n\nRecent inbox:\n${recent}`; }
    if(todos.filter(t=>!t.done).length) sys+=`\n\nCurrent to-dos:\n${todos.filter(t=>!t.done).map(t=>`- ${t.text}`).join('\n')}`;
    return sys;
  };

  const sendMessage = async (text, chatId) => {
    if(!text.trim()) return;
    const cid = chatId||activeChatId;
    if(!cid) return;
    const _tier=getUserTier(userInfo&&userInfo.email);
    const _cfg=getTierConfig(_tier);
    if(getTodayCount(userInfo&&userInfo.email)>=_cfg.limit){
      const _lm={role:'assistant',content:'You have reached your daily limit on the '+_cfg.label+' plan. Upgrade to Pro (Rs100/month) or Premium (Rs299/month) — pay to 9440425257@fam and DM @chatt.yx on Instagram!'};
      setChats(function(prev){return prev.map(function(c){return c.id===cid?{...c,messages:[...c.messages,_lm]}:c;});});
      return;
    }
    incTodayCount(userInfo&&userInfo.email);
    updateMemoryFromMessage(text);
    const userMsg = {role:'user',content:text};
    setChats(prev=>prev.map(c=>c.id===cid?{...c,messages:[...c.messages,userMsg]}:c));
    const thinkingMsg = {role:'assistant',content:'__thinking__',id:'thinking'};
    setChats(prev=>prev.map(c=>c.id===cid?{...c,messages:[...c.messages,thinkingMsg]}:c));
    abortRef.current = new AbortController();
    try {
      const chat = chats.find(c=>c.id===cid);
      const history = (chat?.messages||[]).filter(m=>m.id!=='thinking').map(m=>({role:m.role,content:m.content}));
      const messages = [{role:'system',content:buildSystemPrompt()},...history,userMsg];
      const reply = await callAI(messages,settings,abortRef.current.signal);
      const aiMsg = {role:'assistant',content:reply};
      setChats(prev=>prev.map(c=>{
        if(c.id!==cid) return c;
        const msgs = c.messages.filter(m=>m.id!=='thinking');
        return {...c,messages:[...msgs,aiMsg]};
      }));
      const currentChat = chats.find(c=>c.id===cid);
      if(currentChat&&(currentChat.messages.length<=2||currentChat.title==='New Chat')){
        try {
          const nameReply = await callAI([{role:'user',content:`Give a 3-5 word title for this chat: "${text}". Only the title.`}],settings,new AbortController().signal);
          setChats(prev=>prev.map(c=>c.id===cid?{...c,title:nameReply.trim().replace(/^["']|["']$/g,'')}:c));
        } catch(e){}
      }
    } catch(err) {
      if(err.name!=='AbortError'){
        const errMsg = {role:'assistant',content:`Error: ${err.message}`};
        setChats(prev=>prev.map(c=>{
          if(c.id!==cid) return c;
          const msgs = c.messages.filter(m=>m.id!=='thinking');
          return {...c,messages:[...msgs,errMsg]};
        }));
      } else {
        setChats(prev=>prev.map(c=>({...c,messages:c.messages.filter(m=>m.id!=='thinking')})));
      }
    }
  };

  const stopResponse = () => { abortRef.current?.abort(); };
  const isThinking = activeChat?.messages?.slice(-1)[0]?.content==='__thinking__';

  const junkEmails = emails.filter(e=>{
    const sub=(e.subject||'').toLowerCase(), frm=(e.email||'').toLowerCase();
    return ['newsletter','unsubscribe','promotion','offer','deal','sale','%off','coupon','noreply','no-reply','notification'].some(k=>sub.includes(k)||frm.includes(k));
  });

  const followUpEmails = emails.filter(e=>e.needsReply&&!e.read);

  const today=new Date().toDateString(), yesterday=new Date(Date.now()-86400000).toDateString();
  const groups={Today:[],Yesterday:[],'Previous 7 Days':[],Older:[]};
  chats.forEach(c=>{
    const d=new Date(c.createdAt).toDateString();
    if(d===today) groups.Today.push(c);
    else if(d===yesterday) groups.Yesterday.push(c);
    else if(Date.now()-c.createdAt<7*86400000) groups['Previous 7 Days'].push(c);
    else groups.Older.push(c);
  });

  const unreadCount = emails.filter(e=>!e.read).length;

  // Sign in screen
  if(!gmailToken) {
    return (
      <div className="signin-overlay">
        <div className="signin-card">
          <div className="signin-logo">A</div>
          <div className="signin-title">ChattyCHOP Inbox</div>
          <div className="signin-sub">Sign in with Google to access your inbox, calendar, AI assistant, and more.</div>
          <button className="google-signin-btn" onClick={signInGoogle}>
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Sign in with Google
          </button>
          <p className="signin-note">Your Gmail & Calendar are used to power features. No data is stored on any server.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="app">
      <div className={`sidebar ${sidebarOpen?'':'collapsed'}`}>
        <div className="sidebar-top">
          <button className="new-chat-btn" onClick={newChat}>✏️ New Chat</button>
        </div>
        <div className="sidebar-nav">
          {[
            {id:'chat',icon:'💬',label:'Chat'},
            {id:'inbox',icon:'📩',label:'Inbox',badge:unreadCount},
            {id:'compose',icon:'✉️',label:'Compose'},
            {id:'calendar',icon:'📅',label:'Calendar'},
            {id:'todo',icon:'✅',label:'To Do'},
            {id:'notes',icon:'📝',label:'Notes'},
            {id:'analytics',icon:'📊',label:'Analytics'},
            {id:'support',icon:'🪔',label:'Support'},
          ].map(item=>(
            <div key={item.id} className={`nav-item ${view===item.id?'active':''}`} onClick={()=>setView(item.id)}>
              <span>{item.icon}</span><span>{item.label}</span>
              {item.badge>0&&<span className="nav-badge">{item.badge}</span>}
            </div>
          ))}
        </div>
        <hr className="divider"/>
        <div className="sidebar-chats">
          {Object.entries(groups).map(([group,list])=>list.length===0?null:(
            <div key={group} className="sidebar-section">
              <div className="sidebar-section-label">{group}</div>
              {list.map(c=>(
                <div key={c.id} className={`chat-item ${activeChatId===c.id?'active':''}`} onClick={()=>{setActiveChatId(c.id);setView('chat');}}>
                  <span className="chat-item-title">{c.title}</span>
                  <div className="chat-item-actions">
                    <button className="chat-action-btn" onClick={e=>deleteChat(c.id,e)}>🗑</button>
                  </div>
                </div>
              ))}
            </div>
          ))}
        </div>
        <div className="sidebar-bottom">
          {userInfo && (
            <div className="user-chip">
              {userInfo.picture ? <img className="user-avatar" src={userInfo.picture} alt=""/> : <div className="user-avatar" style={{background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,color:'#fff'}}>{getInitials(userInfo.name)}</div>}
              <div style={{flex:1,minWidth:0}}>
                <div className="user-name">{userInfo.name}</div>
                <div className="user-email">{userInfo.email}</div>
              </div>
              <button className="signout-btn" onClick={signOut} title="Sign out">↩</button>
            </div>
          )}
          <button className="settings-btn" onClick={()=>setShowProModal(true)} style={{color:"#ff6b2b",borderColor:"rgba(255,107,43,.3)"}}>⚡ Upgrade</button>
          <button className="settings-btn" onClick={()=>setShowMemory(true)}>🧠 Memory</button>
          <button className="settings-btn" onClick={()=>setShowSettings(true)}>⚙️ Settings</button>
          <button className="settings-btn" onClick={()=>setView("support")} style={{color:"#ff9933"}}>🪔 Support</button>
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <button className="topbar-toggle" onClick={()=>setSidebarOpen(v=>!v)}>☰</button>
          <span className="topbar-title">
            {view==='chat'?(activeChat?.title||'ChattyCHOP Inbox'):view==='inbox'?'Inbox':view==='compose'?'Compose':view==='calendar'?'Calendar':view==='todo'?'To Do':view==='notes'?'Notes':'Analytics'}
          </span>
          <div className="topbar-right">
            <a href="https://github.com/chattychop/ChattyChop-Inbox" target="_blank" style={{fontSize:"12px",color:"var(--text3)",textDecoration:"none",padding:"4px 10px",border:"1px solid var(--border)",borderRadius:"20px",marginRight:"6px"}}>⭐ Star</a>
            {userInfo&&<TierBadge email={userInfo.email} onClick={()=>setShowProModal(true)}/>}
            <button className="topbar-btn" onClick={()=>setShowAdmin(true)} title="Admin">🔒</button>
            <span className="dot green pulse" title="Signed in"/>
            <div style={{position:'relative'}}>
              <button className="topbar-btn" onClick={()=>setShowNotif(v=>!v)}>
                🔔{newEmails.length>0&&<span className="notif-badge"/>}
              </button>
              {showNotif&&(
                <div className="notif-dropdown">
                  <div className="notif-header">Notifications {newEmails.length>0&&`(${newEmails.length})`}</div>
                  {newEmails.length===0?<div className="empty">No new emails</div>:newEmails.slice(0,8).map((e,i)=>(
                    <div key={i} className="notif-item" onClick={()=>{setSelectedEmail(e);setView('inbox');setShowNotif(false);}}>
                      <div className="notif-from">{e.from}</div>
                      <div className="notif-subject">{e.subject}</div>
                      <div className="notif-time">{formatTime(e.time)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <span className="provider-badge" onClick={()=>setShowSettings(true)}>
              {PROVIDERS[settings.provider]?.name||'Groq'} · {settings.model||PROVIDERS[settings.provider]?.models[0]||''}
            </span>
          </div>
        </div>

        {view==='chat'&&(
          <ChatView chat={activeChat} isThinking={isThinking}
            onSend={(text)=>{
              if(!activeChatId){const id=Date.now().toString();setChats(p=>[{id,title:'New Chat',messages:[],createdAt:Date.now()},...p]);setActiveChatId(id);setTimeout(()=>sendMessage(text,id),50);}
              else sendMessage(text);
            }}
            onStop={stopResponse} onNewChat={newChat}
            memory={memory} emails={emails} todos={todos} setTodos={setTodos} settings={settings} gmailToken={gmailToken}
          />
        )}
        {view==='inbox'&&(
          <InboxView emails={emails} selectedEmail={selectedEmail} setSelectedEmail={setSelectedEmail}
            onDelete={(id)=>setEmails(p=>p.filter(e=>e.id!==id))}
            gmailToken={gmailToken} junkEmails={junkEmails} showClean={showClean} setShowClean={setShowClean}
            followUpEmails={followUpEmails} todos={todos} setTodos={setTodos} settings={settings} memory={memory}
          />
        )}
        {view==='compose'&&<ComposeView gmailToken={gmailToken} settings={settings} memory={memory}/>}
        {view==='calendar'&&<CalendarView gmailToken={gmailToken}/>}
        {view==='todo'&&<TodoView todos={todos} setTodos={setTodos}/>}
        {view==='notes'&&<NotesView notes={notes} setNotes={setNotes}/>}
        {view==='analytics'&&<AnalyticsView emails={emails}/>}
      </div>

      {APP_CONFIG.announcement&&APP_CONFIG.announcement.text&&(
        <div style={{padding:"9px 20px",background:"#0a1a2a",borderBottom:"1px solid rgba(59,130,246,.3)",display:"flex",alignItems:"center",fontSize:13,color:"#60a5fa",flexShrink:0}}>
          {APP_CONFIG.announcement.text}
        </div>
      )}
      {view==="support"&&<SupportView donors={donors} setDonors={setDonors}/>}
      {showSettings&&<SettingsModal settings={settings} setSettings={setSettings} onClose={()=>setShowSettings(false)} userEmail={(userInfo&&userInfo.email)||''}/>}
      {showProModal&&<ProCodeModal onClose={()=>setShowProModal(false)} userEmail={(userInfo&&userInfo.email)||''} onActivated={()=>setShowProModal(false)}/>}
      {showAdmin&&<AdminModal onClose={()=>setShowAdmin(false)} donors={donors} setDonors={setDonors}/>}
      {showMemory&&<MemoryModal memory={memory} setMemory={setMemory} onClose={()=>setShowMemory(false)}/>}
      {showClean&&<CleanModal junkEmails={junkEmails} gmailToken={gmailToken} onClose={()=>setShowClean(false)} onDeleted={(ids)=>setEmails(p=>p.filter(e=>!ids.includes(e.id)))}/>}
    </div>
  );
}

// ── CHAT VIEW ────────────────────────────────────────────────
function ChatView({chat, isThinking, onSend, onStop, onNewChat, memory, emails, todos, setTodos, settings, gmailToken}) {
  const [input, setInput] = useState('');
  const [draft, setDraft] = useState(null);
  const messagesEndRef = useRef(null);
  const textareaRef = useRef(null);

  useEffect(()=>{ messagesEndRef.current?.scrollIntoView({behavior:'smooth'}); },[chat?.messages]);

  const handleSend = () => {
    if(!input.trim()||isThinking) return;
    onSend(input.trim()); setInput('');
  };
  const handleKey = (e) => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();} };

  const starters = ['📊 Summarise my unread emails','✅ What should I do today?','📝 Draft a professional reply','🔍 What emails need follow-up?'];

  if(!chat) return (
    <div className="chat-view">
      <div className="welcome">
        <div className="welcome-logo">A</div>
        <div className="welcome-title">ChattyCHOP Inbox{memory.name?`, ${memory.name}`:''}</div>
        <div className="welcome-sub">Your AI-powered work assistant. Ask me anything, draft emails, manage tasks, and more.</div>
        <div className="starters">
          {starters.map((s,i)=>(
            <button key={i} className="starter" onClick={()=>{onNewChat();setTimeout(()=>onSend(s.replace(/^[^\s]+ /,'')),80);}}>{s}</button>
          ))}
        </div>
      </div>
    </div>
  );

  return (
    <div className="chat-view">
      <div className="messages">
        {(chat.messages||[]).filter(m=>m.id!=='thinking').map((m,i)=>(
          <div key={i} className={`message-row ${m.role}`}>
            <div className={`avatar ${m.role==='user'?'user':'ai'}`}>{m.role==='user'?(memory.name?memory.name[0].toUpperCase():'U'):'A'}</div>
            <div className={`bubble ${m.role==='user'?'user':'ai'}`} dangerouslySetInnerHTML={{__html:m.role==='assistant'?marked.parse(m.content||''):m.content}}/>
          </div>
        ))}
        {isThinking&&(
          <div className="message-row">
            <div className="avatar ai">A</div>
            <div className="bubble ai"><div className="typing-dots"><span/><span/><span/></div></div>
          </div>
        )}
        <div ref={messagesEndRef}/>
      </div>
      {draft&&(
        <div className="draft-banner">
          <div className="draft-banner-label">📧 Draft Email</div>
          <div className="draft-to">To: {draft.to}</div>
          <div className="draft-subject">Subject: {draft.subject}</div>
          <textarea className="draft-body" value={draft.body} onChange={e=>setDraft(d=>({...d,body:e.target.value}))} rows={5}/>
          <div className="draft-actions">
            <button className="draft-send" onClick={async()=>{
              try{
                const raw=btoa(unescape(encodeURIComponent(`To: ${draft.to}\r\nSubject: ${draft.subject}\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n${draft.body}`))).replace(/\+/g,'-').replace(/\//g,'_');
                const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{'Authorization':`Bearer ${gmailToken}`,'Content-Type':'application/json'},body:JSON.stringify({raw})});
                if(r.ok){setDraft(null);onSend('Email sent!');}
                else{const d=await r.json();alert('Failed: '+(d.error?.message||'error'));}
              }catch(e){alert('Error: '+e.message);}
            }}>✅ Send</button>
            <button className="draft-cancel" onClick={()=>setDraft(null)}>Cancel</button>
          </div>
        </div>
      )}
      <div className="input-area">
        <div className="input-wrap">
          <textarea ref={textareaRef} placeholder="Ask anything..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey} rows={1} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}/>
          {isThinking?<button className="stop-btn" onClick={onStop}>■</button>:<button className="send-btn" onClick={handleSend} disabled={!input.trim()}>↑</button>}
        </div>
        <div className="input-hint">Shift+Enter for new line · AI reads your emails, tasks & memory</div>
      </div>
    </div>
  );
}

// ── INBOX VIEW ───────────────────────────────────────────────
function InboxView({emails, selectedEmail, setSelectedEmail, onDelete, gmailToken, junkEmails, showClean, setShowClean, followUpEmails, todos, setTodos, settings, memory}) {
  const [search, setSearch] = useState('');
  const [filterLabel, setFilterLabel] = useState('all');
  const [showFull, setShowFull] = useState(false);
  const [draft, setDraft] = useState(null);
  const [drafting, setDrafting] = useState(false);
  const [importance, setImportance] = useState(null);

  const filtered = emails.filter(e=>{
    if(search){const q=search.toLowerCase();if(!(e.from||'').toLowerCase().includes(q)&&!(e.subject||'').toLowerCase().includes(q)&&!(e.body||'').toLowerCase().includes(q))return false;}
    if(filterLabel!=='all'&&e.label!==filterLabel) return false;
    return true;
  });

  const markRead = async(email)=>{
    try{await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${email.id}/modify`,{method:'POST',headers:{'Authorization':`Bearer ${gmailToken}`,'Content-Type':'application/json'},body:JSON.stringify({removeLabelIds:['UNREAD']})});}catch(e){}
  };

  const analyseImportance = async(email)=>{
    try{
      const reply=await callAI([{role:'system',content:'Analyse email importance. Reply with ONE word only: Critical, High, Medium, or Spam.'},{role:'user',content:`From: ${email.from}\nSubject: ${email.subject}\nBody: ${(email.body||'').slice(0,500)}`}],settings,new AbortController().signal);
      const l=reply.trim().toLowerCase();
      setImportance(l.includes('critical')?'critical':l.includes('high')?'high':l.includes('spam')?'spam':'medium');
    }catch(e){}
  };

  const draftReply = async(email)=>{
    setDrafting(true);
    try{
      const m=memory;
      const sys=`You are ${m.name||'the user'}${m.company?', working at '+m.company:''}. Write a natural, human reply. No markdown, no **bold**. Be professional but human.`;
      const reply=await callAI([{role:'system',content:sys},{role:'user',content:`Reply to:\nFrom: ${email.from}\nSubject: ${email.subject}\nBody: ${(email.body||'').slice(0,800)}`}],settings,new AbortController().signal);
      setDraft({to:email.email,subject:`Re: ${email.subject}`,body:reply});
    }catch(e){alert('Draft failed: '+e.message);}
    setDrafting(false);
  };

  const sendEmail=async()=>{
    if(!draft) return;
    try{
      const raw=btoa(unescape(encodeURIComponent(`To: ${draft.to}\r\nSubject: ${draft.subject}\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n${draft.body}`))).replace(/\+/g,'-').replace(/\//g,'_');
      const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{'Authorization':`Bearer ${gmailToken}`,'Content-Type':'application/json'},body:JSON.stringify({raw})});
      if(r.ok){setDraft(null);alert('Email sent!');}
      else{const d=await r.json();alert('Failed: '+(d.error?.message||'error'));}
    }catch(e){alert('Error: '+e.message);}
  };

  const deleteEmail=async(id)=>{
    try{await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}/trash`,{method:'POST',headers:{'Authorization':`Bearer ${gmailToken}`}});onDelete(id);if(selectedEmail?.id===id)setSelectedEmail(null);}catch(e){}
  };

  const addTodo=(text,source)=>setTodos(prev=>[...prev,{id:Date.now().toString(),text,done:false,source,createdAt:Date.now()}]);

  if(selectedEmail) return (
    <div className="email-detail">
      <div className="email-detail-header">
        <button className="action-btn secondary" style={{marginBottom:12}} onClick={()=>{setSelectedEmail(null);setDraft(null);setImportance(null);}}>← Back</button>
        <div className="email-detail-subject">{selectedEmail.subject}</div>
        <div className="email-detail-meta">
          <span className="email-detail-from">From: {selectedEmail.from} &lt;{selectedEmail.email}&gt;</span>
          <span className="email-detail-time">{formatTime(selectedEmail.time)}</span>

// ── COMPOSE VIEW ─────────────────────────────────────────────
function ComposeView({gmailToken, settings, memory}) {
  const [to,setTo]=useState('');const [subject,setSubject]=useState('');const [body,setBody]=useState('');
  const [aiPrompt,setAiPrompt]=useState('');const [drafting,setDrafting]=useState(false);const [sent,setSent]=useState(false);

  if(sent) return (
    <div className="compose-view" style={{display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
        <div style={{fontSize:48}}>✅</div>
        <div style={{fontSize:20,fontWeight:700}}>Email Sent!</div>
        <button className="action-btn primary" onClick={()=>{setSent(false);setTo('');setSubject('');setBody('');setAiPrompt('');}}>Compose Another</button>
      </div>
    </div>
  );

  const draftWithAI=async()=>{
    if(!aiPrompt.trim()) return;setDrafting(true);
    try{
      const m=memory;
      const reply=await callAI([{role:'system',content:`You are ${m.name||'the user'}${m.company?', working at '+m.company:''}. Draft a professional email. Return JSON only: {"to":"email if mentioned else empty","subject":"subject line","body":"email body no markdown"}. No extra text.`},{role:'user',content:aiPrompt}],settings,new AbortController().signal);
      const clean=reply.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);
      if(parsed.to&&!to)setTo(parsed.to);if(parsed.subject)setSubject(parsed.subject);if(parsed.body)setBody(parsed.body);
    }catch(e){alert('Draft failed: '+e.message);}
    setDrafting(false);
  };

  const sendEmail=async()=>{
    if(!to||!subject||!body){alert('Please fill in all fields');return;}
    try{
      const raw=btoa(unescape(encodeURIComponent(`To: ${to}\r\nSubject: ${subject}\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n${body}`))).replace(/\+/g,'-').replace(/\//g,'_');
      const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{'Authorization':`Bearer ${gmailToken}`,'Content-Type':'application/json'},body:JSON.stringify({raw})});
      if(r.ok)setSent(true);else{const d=await r.json();alert('Failed: '+(d.error?.message||'error'));}
    }catch(e){alert('Error: '+e.message);}
  };

  return (
    <div className="compose-view">
      <div className="compose-card" style={{margin:'0 auto'}}>
        <div className="compose-ai-bar">
          <input className="compose-ai-input" placeholder="e.g. Email sarah@gmail.com to say the meeting is delayed" value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&draftWithAI()}/>
          <button className="compose-ai-btn" onClick={draftWithAI} disabled={drafting}>{drafting?'Drafting...':'✨ AI Draft'}</button>
        </div>
        <div className="compose-field"><div className="compose-label">To</div><input className="compose-input" placeholder="recipient@email.com" value={to} onChange={e=>setTo(e.target.value)}/></div>
        <div className="compose-field"><div className="compose-label">Subject</div><input className="compose-input" placeholder="Subject line" value={subject} onChange={e=>setSubject(e.target.value)}/></div>
        <textarea className="compose-body" placeholder="Write your email here..." value={body} onChange={e=>setBody(e.target.value)}/>
        {body&&(
          <div style={{display:"flex",gap:8,paddingBottom:10}}>
            <button className="action-btn secondary" onClick={function(){
              callAI([{role:"user",content:"Check how AI this sounds, give score 0-100 and one sentence why: "+body}],settings,new AbortController().signal)
                .then(function(r){alert(r);}).catch(function(e){alert(e.message);});
            }}>🤖 AI Check</button>
            <button className="action-btn secondary" style={{color:"var(--accent)"}} onClick={function(){
              callAI([{role:"user",content:"Rewrite to sound 100% human, same meaning: "+body}],settings,new AbortController().signal)
                .then(function(r){setBody(r);}).catch(function(e){alert(e.message);});
            }}>✨ Humanize</button>
          </div>
        )}
        <div className="compose-footer">
          <button className="action-btn primary" onClick={sendEmail}>✈️ Send Email</button>
          <button className="action-btn secondary" onClick={()=>{setTo('');setSubject('');setBody('');setAiPrompt('');}}>Clear</button>
        </div>
      </div>
    </div>
  );
}

// ── CALENDAR VIEW ────────────────────────────────────────────
function CalendarView({gmailToken}) {
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [currentDate, setCurrentDate] = useState(new Date());
  const [selectedDay, setSelectedDay] = useState(new Date());

  useEffect(()=>{
    if(!gmailToken) return;
    setLoading(true);
    const now = new Date();
    const min = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
    const max = new Date(now.getFullYear(), now.getMonth()+2, 0).toISOString();
    calendarFetch(`/calendars/primary/events?timeMin=${min}&timeMax=${max}&singleEvents=true&orderBy=startTime&maxResults=100`, gmailToken)
      .then(data=>{
        setEvents(data.items||[]);setLoading(false);
      }).catch(()=>setLoading(false));
  },[gmailToken]);

  const year=currentDate.getFullYear(), month=currentDate.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const prevDays=new Date(year,month,0).getDate();
  const today=new Date();

  const getEventsForDay=(d)=>{
    return events.filter(e=>{
      const start=new Date(e.start?.dateTime||e.start?.date);
      return start.getFullYear()===year&&start.getMonth()===month&&start.getDate()===d;
    });
  };

  const selectedEvents = getEventsForDay(selectedDay.getDate());
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];

  const cells=[];
  for(let i=0;i<firstDay;i++) cells.push({day:prevDays-firstDay+1+i,current:false});
  for(let i=1;i<=daysInMonth;i++) cells.push({day:i,current:true});
  const remaining=42-cells.length;
  for(let i=1;i<=remaining;i++) cells.push({day:i,current:false});

  const formatEventTime=(e)=>{
    if(e.start?.dateTime) return new Date(e.start.dateTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return 'All day';
  };

  return (
    <div className="calendar-view">
      <div className="cal-header">
        <button className="cal-nav-btn" onClick={()=>setCurrentDate(new Date(year,month-1,1))}>‹</button>
        <div className="cal-month-title">{monthNames[month]} {year}</div>
        <button className="cal-nav-btn" onClick={()=>setCurrentDate(new Date(year,month+1,1))}>›</button>
      </div>
      {loading?<div className="cal-loading">Loading calendar...</div>:(
        <>
          <div className="cal-grid">
            {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d} className="cal-day-header">{d}</div>)}
            {cells.map((cell,i)=>{
              const evs=cell.current?getEventsForDay(cell.day):[];
              const isToday=cell.current&&cell.day===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
              const isSel=cell.current&&cell.day===selectedDay.getDate()&&month===selectedDay.getMonth()&&year===selectedDay.getFullYear();
              return (
                <div key={i} className={`cal-day ${isToday?'today':''} ${!cell.current?'other-month':''}`}
                  style={isSel&&!isToday?{borderColor:'var(--blue)'}:{}}
                  onClick={()=>{if(cell.current)setSelectedDay(new Date(year,month,cell.day));}}>
                  <div className="cal-day-num" style={{color:isToday?'var(--accent)':''}}>{cell.day}</div>
                  {evs.slice(0,2).map((e,j)=><div key={j} className="cal-event-dot">· {e.summary||'Event'}</div>)}
                  {evs.length>2&&<div className="cal-event-dot" style={{color:'var(--text3)'}}>+{evs.length-2} more</div>}
                </div>
              );
            })}
          </div>
          <div className="cal-events-list">
            <h3>{selectedDay.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</h3>
            {selectedEvents.length===0?<div className="empty" style={{padding:'20px 0'}}>No events</div>:selectedEvents.map((e,i)=>(
              <div key={i} className="cal-event-item">
                <div className="cal-event-time">{formatEventTime(e)}</div>
                <div>
                  <div className="cal-event-title">{e.summary||'(No title)'}</div>
                  {e.location&&<div className="cal-event-loc">📍 {e.location}</div>}
                  {e.description&&<div className="cal-event-loc">{e.description.slice(0,80)}</div>}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function TodoView({todos, setTodos}) {
  const [input,setInput]=useState('');
  const add=()=>{if(!input.trim())return;setTodos(p=>[...p,{id:Date.now().toString(),text:input.trim(),done:false,createdAt:Date.now()}]);setInput('');};
  const toggle=(id)=>setTodos(p=>p.map(t=>t.id===id?{...t,done:!t.done}:t));
  const del=(id)=>setTodos(p=>p.filter(t=>t.id!==id));
  const active=todos.filter(t=>!t.done), done=todos.filter(t=>t.done);
  return (
    <div className="todo-view">
      <div className="panel-header"><div className="panel-title">To Do</div></div>
      <div className="todo-input-row">
        <input className="todo-input" placeholder="Add a task..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}/>
        <button className="todo-add-btn" onClick={add}>Add</button>
      </div>
      {active.length===0&&done.length===0&&<div className="empty">No tasks yet.</div>}
      {active.map(t=>(
        <div key={t.id} className="todo-item">
          <div className={`todo-check ${t.done?'checked':''}`} onClick={()=>toggle(t.id)}>{t.done&&'✓'}</div>
          <div style={{flex:1}}>
            <div className={`todo-text ${t.done?'done':''}`}>{t.text}</div>
            {t.source&&<div className="todo-source">📧 {t.source}</div>}
          </div>
          <button className="todo-del" onClick={()=>del(t.id)}>🗑</button>
        </div>
      ))}
      {done.length>0&&<>
        <div className="sidebar-section-label" style={{margin:'16px 0 8px'}}>Completed</div>
        {done.map(t=>(
          <div key={t.id} className="todo-item done">
            <div className="todo-check checked" onClick={()=>toggle(t.id)}>✓</div>
            <div className="todo-text done" style={{flex:1}}>{t.text}</div>
            <button className="todo-del" onClick={()=>del(t.id)}>🗑</button>
          </div>
        ))}
      </>}
    </div>
  );
}
