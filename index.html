// ── ANALYTICS VIEW ───────────────────────────────────────────
function AnalyticsView({emails}) {
  const unread=emails.filter(e=>!e.read).length;
  const urgent=emails.filter(e=>e.urgent).length;
  const needsReply=emails.filter(e=>e.needsReply&&!e.read).length;
  const senderMap={};
  emails.forEach(e=>{senderMap[e.from]=(senderMap[e.from]||0)+1;});
  const topSenders=Object.entries(senderMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCount=topSenders[0]?.[1]||1;

  // Hourly breakdown
  const hourMap=new Array(24).fill(0);
  emails.forEach(e=>{if(e.time){const h=new Date(e.time).getHours();hourMap[h]++;}});
  const maxHour=Math.max(...hourMap,1);

  // Label breakdown
  const labelMap={work:0,personal:0,finance:0,alert:0,other:0};
  emails.forEach(e=>{if(e.label&&labelMap[e.label]!==undefined)labelMap[e.label]++;else if(!e.label)labelMap.other++;});

  const labelColors={work:'#1e3a5f',personal:'#2d1a4a',finance:'#1a2e1a',alert:'#7f1d1d',other:'var(--surface2)'};
  const labelText={work:'#93c5fd',personal:'#c4b5fd',finance:'#86efac',alert:'#fca5a5',other:'var(--text3)'};

  return (
    <div className="analytics-view">
      <div className="panel-header"><div className="panel-title">Analytics</div></div>
      <div className="stat-grid">
        <div className="stat-card"><div className="stat-num">{emails.length}</div><div className="stat-label">Total Emails</div></div>
        <div className="stat-card"><div className="stat-num" style={{color:'var(--red)'}}>{unread}</div><div className="stat-label">Unread</div></div>
        <div className="stat-card"><div className="stat-num" style={{color:'var(--yellow)'}}>{urgent}</div><div className="stat-label">Urgent</div></div>
        <div className="stat-card"><div className="stat-num" style={{color:'var(--blue)'}}>{needsReply}</div><div className="stat-label">Need Reply</div></div>
        <div className="stat-card"><div className="stat-num" style={{color:'var(--green)'}}>{emails.filter(e=>e.read).length}</div><div className="stat-label">Read</div></div>
        <div className="stat-card"><div className="stat-num" style={{color:'var(--purple)'}}>{emails.filter(e=>e.label==='work').length}</div><div className="stat-label">Work Emails</div></div>
      </div>

      <div className="analytics-section">
        <h3>📬 Top Senders</h3>
        {topSenders.length===0?<div className="empty" style={{padding:'20px 0'}}>No data yet</div>:topSenders.map(([name,count],i)=>(
          <div key={i} className="sender-row">
            <div style={{fontSize:13,width:160,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',color:'var(--text2)'}}>{name}</div>
            <div className="sender-bar-wrap"><div className="sender-bar" style={{width:`${(count/maxCount)*100}%`}}/></div>
            <div className="sender-count">{count}</div>
          </div>
        ))}
      </div>

      <div className="analytics-section">
        <h3>🕐 Emails by Hour</h3>
        <div className="hour-grid">
          {hourMap.slice(0,12).map((count,h)=>(
            <div key={h} className="hour-bar-wrap">
              <div className="hour-bar" style={{height:`${Math.max((count/maxHour)*60,2)}px`}}/>
              <div className="hour-label">{h===0?'12a':h<12?h+'a':h===12?'12p':(h-12)+'p'}</div>
            </div>
          ))}
        </div>
        <div className="hour-grid" style={{marginTop:8}}>
          {hourMap.slice(12).map((count,h)=>(
            <div key={h+12} className="hour-bar-wrap">
              <div className="hour-bar" style={{height:`${Math.max((count/maxHour)*60,2)}px`,background:'var(--blue)'}}/>
              <div className="hour-label">{h+12===12?'12p':(h)+'p'}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="analytics-section">
        <h3>🏷️ Smart Labels</h3>
        <div className="label-chart">
          {Object.entries(labelMap).filter(([,v])=>v>0).map(([k,v])=>(
            <div key={k} className="label-chip" style={{background:labelColors[k],color:labelText[k]}}>
              {k.charAt(0).toUpperCase()+k.slice(1)}: {v}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── CLEAN MODAL ──────────────────────────────────────────────
function CleanModal({junkEmails, gmailToken, onClose, onDeleted}) {
  const [selected,setSelected]=useState(new Set(junkEmails.map(e=>e.id)));const [deleting,setDeleting]=useState(false);
  const deleteSelected=async()=>{
    setDeleting(true);const ids=[...selected];
    for(const id of ids){try{await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}/trash`,{method:'POST',headers:{'Authorization':`Bearer ${gmailToken}`}});}catch(e){}}
    onDeleted(ids);setDeleting(false);onClose();
  };
  const reasons={newsletter:'Newsletter',unsubscribe:'Unsubscribe link',promotion:'Promotion',noreply:'No-reply sender',notification:'Automated notification'};
  const getReason=(e)=>{const sub=(e.subject||'').toLowerCase(),frm=(e.email||'').toLowerCase();for(const[k,v] of Object.entries(reasons))if(sub.includes(k)||frm.includes(k))return v;return 'Looks like junk';};
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <h2>🧹 Smart Clean</h2>
        <p style={{fontSize:13,color:'var(--text2)',marginBottom:16}}>Review and select which emails to trash. Recoverable from Gmail Trash within 30 days.</p>
        {junkEmails.map(e=>(
          <div key={e.id} className="clean-email-item">
            <input type="checkbox" className="clean-email-check" checked={selected.has(e.id)} onChange={ev=>{const s=new Set(selected);ev.target.checked?s.add(e.id):s.delete(e.id);setSelected(s);}}/>
            <div className="clean-email-info">
              <div className="clean-email-from">{e.from}</div>
              <div className="clean-email-subject">{e.subject}</div>
              <div className="clean-email-reason">{getReason(e)}</div>
            </div>
          </div>
        ))}
        <div className="modal-actions">
          <span style={{fontSize:13,color:'var(--text3)',flex:1}}>{selected.size} selected</span>
          <button className="modal-cancel" onClick={onClose}>Cancel</button>
          <button className="modal-save" style={{background:'var(--red)'}} onClick={deleteSelected} disabled={deleting||selected.size===0}>{deleting?'Deleting...':`🗑 Delete ${selected.size}`}</button>
        </div>
      </div>
    </div>
  );
}

function AdminModal({onClose,donors,setDonors}){
  var [step,setStep]=useState(1);
  var [pass,setPass]=useState('');
  var [msg,setMsg]=useState('');
  var [name,setName]=useState('');
  var [city,setCity]=useState('');
  var [flag,setFlag]=useState('');
  var [amt,setAmt]=useState('');
  var inp={width:'100%',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:7,padding:'8px 12px',color:'var(--text)',fontSize:13,fontFamily:'monospace',outline:'none',boxSizing:'border-box',marginBottom:6};
  var btn={width:'100%',padding:9,background:'rgba(0,245,255,.1)',border:'1px solid rgba(0,245,255,.3)',borderRadius:6,color:'#00f5ff',cursor:'pointer',fontFamily:'monospace',fontSize:12,letterSpacing:1,marginBottom:6};
  function addDonor(){
    if(!name.trim()||!city.trim()||!amt){setMsg('Fill all fields!');return;}
    var d={name:name.trim(),city:city.trim(),flag:flag.trim()||'🌍',amount:parseInt(amt)||0};
    setDonors(function(p){return [...p,d];});
    setMsg('Saving...');
    fetch(GAS_URL+"?action=addDonor&name="+encodeURIComponent(d.name)+"&city="+encodeURIComponent(d.city)+"&flag="+encodeURIComponent(d.flag)+"&amount="+d.amount+"&t="+Date.now())
      .then(function(){setMsg(d.name+' added to both apps!');})
      .catch(function(){setMsg('Saved locally');});
    setName('');setCity('');setFlag('');setAmt('');
    setTimeout(function(){setMsg('');},3000);
  }
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div style={{background:'#0d0020',border:'1px solid rgba(0,245,255,.3)',borderRadius:12,padding:22,width:320,maxWidth:'92vw',maxHeight:'90vh',overflowY:'auto',fontFamily:'monospace'}} onClick={function(e){e.stopPropagation();}}>
        <div style={{color:'#00f5ff',fontWeight:700,textAlign:'center',marginBottom:14,letterSpacing:3,fontSize:14}}>ADMIN PANEL</div>
        {step===1?(
          <>
            <div style={{fontSize:11,color:'rgba(255,255,255,.4)',marginBottom:5,letterSpacing:2}}>PASSWORD</div>
            <input type="password" value={pass} onChange={function(e){setPass(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter'){if(pass==='2005')setStep(2);else setMsg('WRONG PASSWORD');}}} placeholder="password" style={inp}/>
            {msg&&<div style={{color:'#ff5555',fontSize:11,textAlign:'center',marginBottom:6}}>{msg}</div>}
            <button onClick={function(){if(pass==='2005')setStep(2);else setMsg('WRONG PASSWORD');}} style={btn}>UNLOCK</button>
            <button onClick={onClose} style={{...btn,background:'transparent',border:'1px solid rgba(255,255,255,.1)',color:'rgba(255,255,255,.3)'}}>CANCEL</button>
          </>
        ):(
          <>
            <div style={{fontSize:11,color:'rgba(255,255,255,.4)',marginBottom:6,letterSpacing:2}}>ADD DONOR</div>
            <input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Name" style={inp}/>
            <input value={city} onChange={function(e){setCity(e.target.value);}} placeholder="City" style={inp}/>
            <div style={{display:'flex',gap:6,marginBottom:6}}>
              <input value={flag} onChange={function(e){setFlag(e.target.value);}} placeholder="Flag" style={{...inp,width:'50%',marginBottom:0}}/>
              <input value={amt} onChange={function(e){setAmt(e.target.value);}} placeholder="Amount" type="number" style={{...inp,width:'50%',marginBottom:0}}/>
            </div>
            <button onClick={addDonor} style={{...btn,marginTop:6}}>ADD DONOR</button>
            {msg&&<div style={{fontSize:11,textAlign:'center',marginBottom:6,color:'#00e676'}}>{msg}</div>}
            <div style={{fontSize:11,color:'rgba(255,255,255,.4)',marginBottom:5}}>DONORS ({donors.length})</div>
            <div style={{maxHeight:130,overflowY:'auto',marginBottom:8}}>
              {donors.length===0
                ?<div style={{color:'rgba(0,245,255,.3)',fontSize:11}}>No donors yet</div>

                  <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid rgba(0,245,255,.1)',padding:'3px 0',fontSize:11}}>
                    <span style={{color:'#ccc'}}>{d.flag} {d.name} · {d.city} · Rs{d.amount}</span>

                      setDonors(function(p){return p.filter(function(_,j){return j!==i;});});

                    }} style={{cursor:'pointer',color:'#ff5555',padding:'0 6px'}}>x</span>
                  </div>
                );})}
            </div>
            <button onClick={onClose} style={{...btn,background:'transparent',border:'1px solid rgba(255,255,255,.1)',color:'rgba(255,255,255,.3)'}}>CLOSE</button>
          </>
        )}
      </div>
    </div>
  );
}
